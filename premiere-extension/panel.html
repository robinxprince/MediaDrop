<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaDrop</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main class="panel">
    <div class="col-main">
      <section class="status" aria-live="polite">
        <div class="status-top">
          <img class="logo" src="assets/logo.png" alt="" width="28" height="28">
          <div class="status-words">
            <h1 id="statusTitle">Checking…</h1>
            <p id="statusText">Looking for Premiere Pro and the MediaDrop app.</p>
          </div>
          <span id="statusDot" class="dot" aria-hidden="true"></span>
        </div>

        <div class="route" id="route">
          <svg id="routeIcon" class="route-icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
          <div class="route-words">
            <span class="route-label">Downloads go to</span>
            <span id="routeTarget" class="route-target">—</span>
          </div>
        </div>

        <button id="btnOpen" class="btn-primary" type="button">Open MediaDrop</button>
      </section>

      <section class="starts">
        <h2>Find media on</h2>
        <form id="searchForm" class="search" autocomplete="off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="What do you need? e.g. drone city night" spellcheck="false" aria-label="Search for media">
        </form>
        <div class="start-row">
          <button class="start" type="button" data-site="youtube">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="#ff0033"/><path d="M10 9.2v5.6l4.8-2.8z" fill="#fff"/></svg>
            YouTube
          </button>
          <button class="start" type="button" data-site="envato">
            <svg viewBox="0 0 48 48" aria-hidden="true"><rect fill="#87e64b" width="48" height="48" rx="10"/><circle fill="#1a4200" cx="25.629" cy="40.106" r="2"/><path fill="#1a4200" d="M34.719 29.331l-8.916.955c-.163.018-.247-.19-.117-.291l8.724-6.792c.566-.464.926-1.185.772-1.957-.154-1.185-1.133-1.957-2.369-1.803l-9.48 1.389c-.166.024-.256-.19-.122-.292l9.396-7.173c1.854-1.442 2.009-4.275.31-5.923-1.546-1.545-4.018-1.493-5.563.052l-15.14 15.398a2.681 2.681 0 0 0-.67 2.317c.258 1.39 1.648 2.318 3.039 2.06l8.162-1.664c.177-.037.273.2.12.297L13.81 31.7c-1.133.721-1.648 2.009-1.287 3.296.36 1.7 2.06 2.678 3.708 2.266l13.535-3.334a.163.163 0 0 1 .166.261l-2.114 2.61c-.567.72.36 1.699 1.133 1.132l6.952-5.716c1.236-1.03.412-3.038-1.184-2.884z"/></svg>
            Envato
          </button>
          <button class="start" type="button" data-site="google">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" fill="#4285f4"/><circle cx="9" cy="9.5" r="1.8" fill="#fff"/><path d="M5.5 17.5l4.5-5 3 3.2 2-2.2 3.5 4z" fill="#fff"/></svg>
            Google Images
          </button>
        </div>
      </section>

      <dl class="context">
        <div><dt>Project</dt><dd id="projVal">—</dd></div>
        <div><dt>Sequence</dt><dd id="seqVal">—</dd></div>
      </dl>
    </div>

    <section class="recent">
      <div id="downloading" class="downloading" hidden>
        <h2>Downloading</h2>
        <ul id="dlList" class="dl-list"></ul>
      </div>
      <div class="recent-head">
        <h2>Recent imports</h2>
        <button id="btnClear" class="btn-text" type="button" hidden>Clear</button>
      </div>
      <ul id="recentList" class="recent-list"></ul>
      <div id="recentEmpty" class="recent-empty">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="11" width="36" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M24 17v11m-5-5 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p><strong>Nothing imported yet</strong>Pick a site above, find a clip and click Download. It drops into your project and shows up here.</p>
      </div>
    </section>
  </main>

  <script src="CSInterface.js"></script>
  <script src="desktop.js"></script>
  <script src="panel.js"></script>
</body>
</html>
